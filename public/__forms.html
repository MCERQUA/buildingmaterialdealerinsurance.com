<!DOCTYPE html>
<html>
  <head><title>Netlify Form Declarations</title></head>
  <body>
    <!-- Quote form declaration for Netlify form detection -->
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />
  <input name="name" />
  <input name="businessName" />
  <input name="email" />
  <input name="phone" />
  <input name="state" />
  <input name="dealerType" />
  <input name="primaryCoverage" />
  <input name="inventoryValue" />
  <input name="message" />
  <input name="annual_gross_sales" />
  <input name="city" />
  <input name="coverage_for_uninsured_subcontractors" />
  <input name="estimated_employee_count" />
  <input name="estimated_employee_payroll" />
  <input name="estimated_gross_sales" />
  <input name="estimated_material_costs" />
  <input name="estimated_subcontractor_expenses" />
  <input name="percent_subcontractors_insured" />
  <input name="prior_policy_expiration" />
  <input name="prior_policy_number" />
  <input name="prior_year_employee_count" />
  <input name="prior_year_employee_payroll" />
  <input name="prior_year_gross_sales" />
  <input name="prior_year_subcontractor_expenses" />
  <input name="street_address" />
  <input name="subcontractors_have_insurance" />
  <input name="zip" />
</form>

    <!-- Contact form declaration for Netlify form detection -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" type="hidden" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="subject" type="text" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
